# cloudbuild.yaml — Google Cloud Build configuration for VibeStump
# Deploys to Cloud Run in a single step.
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml .
#
# Required substitutions (set via Cloud Build trigger or CLI):
#   _GEMINI_API_KEY  — your Gemini API key

steps:
  # Step 1: Run tests inside the container
  - name: "python:3.11-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install -q -r requirements.txt
        python -m pytest tests/ -v --tb=short

  # Step 2: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/vibestump:$COMMIT_SHA"
      - "."

  # Step 3: Push the image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/vibestump:$COMMIT_SHA"

  # Step 4: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "vibestump"
      - "--image"
      - "gcr.io/$PROJECT_ID/vibestump:$COMMIT_SHA"
      - "--region"
      - "asia-south1"
      - "--port"
      - "8080"
      - "--allow-unauthenticated"
      - "--set-env-vars"
      - "GEMINI_API_KEY=${_GEMINI_API_KEY}"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "10"

images:
  - "gcr.io/$PROJECT_ID/vibestump:$COMMIT_SHA"

substitutions:
  _GEMINI_API_KEY: ""

options:
  logging: CLOUD_LOGGING_ONLY
